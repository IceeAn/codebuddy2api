name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python3 -m venv venv

      - name: Install dependencies
        run: venv/bin/python3 -m pip install -r requirements-dev.txt

      - name: 审计运行时依赖
        run: |
          python3 -m venv audit-venv
          audit-venv/bin/python3 -m pip install pip-audit==2.10.1
          audit-venv/bin/python3 -m pip_audit -r requirements.txt --vulnerability-service osv

      - name: Download locked tokenizers
        run: python3 scripts/download_tokenizers.py

      - name: Run backend tests
        run: venv/bin/python3 -m coverage run -m unittest discover -s tests

      - name: Check backend coverage
        run: venv/bin/python3 -m coverage report

  codex-contract:
    name: Codex CLI Responses 契约
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: 设置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: 安装契约测试依赖
        run: |
          python3 -m venv venv
          venv/bin/python3 -m pip install -r requirements-dev.txt
          npm install -g @openai/codex@0.153.4
      - name: 验证真实客户端
        env:
          CODEBUDDY_TEST_CODEX: "1"
          CODEBUDDY_LOG_LEVEL: CRITICAL
        run: venv/bin/python3 -m unittest tests.test_codex_responses_contract

  release-lock-windows:
    name: Release Lock (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Run Windows release lock tests
        run: python -m unittest discover -s tests -p "test_release_runtime_lock.py"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.29.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 审计前端依赖
        run: pnpm audit --audit-level low

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build frontend
        run: pnpm run build:bundle

      - name: Run frontend tests
        run: pnpm run test:coverage

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: pnpm run e2e
