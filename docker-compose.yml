services:
  codebuddy2api:
    image: ghcr.io/iceean/codebuddy2api:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # 容器运行数据必须写入持久化挂载点，不接受 .env 覆盖。
      CODEBUDDY_DATA_DIR: /app/data
      # 签到等本地自然日调度的时区；默认与镜像一致，可由 shell 或 .env 覆盖。
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # SQLite 与 CodeBuddy 凭证持久化
      - ./data:/app/data
      # 仅供旧版 users.txt 首次迁移；账号迁移完成后可删除该文件。
      - ./secrets:/app/secrets:ro
    env_file:
      - path: .env
        required: false
